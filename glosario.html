": "SI", "variants": [{"def": "Función que devuelve un valor si una condición es verdadera y otro si es falsa: <code>=SI(prueba; si_verdadero; si_falso)<\/code>.", "label": "SI", "clases": ["10"], "icon": ""}], "divergente": false}, {"term": "Storytelling", "variants": [{"def": "Técnica de organizar contenido real (no ficción) como una historia, para sostener la atención de quien escucha o lee.", "label": "Storytelling", "clases": ["06"], "icon": ""}], "divergente": false}, {"term": "Storytelling con datos", "variants": [{"def": "Comunicar un hallazgo numérico como una historia con gancho, desarrollo y cierre, en vez de solo mostrar la tabla.", "label": "Storytelling con datos", "clases": ["15"], "icon": ""}], "divergente": false}, {"term": "Subtotal", "variants": [{"def": "Herramienta que inserta filas con un cálculo cada vez que cambia el valor de una columna; requiere la tabla ordenada.", "label": "Subtotal", "clases": ["10"], "icon": ""}], "divergente": false}, {"term": "SUMA", "variants": [{"def": "Función que devuelve la suma de los valores de un rango.", "label": "SUMA", "clases": ["09"], "icon": ""}], "divergente": false}, {"term": "SUMAR.SI", "variants": [{"def": "Función que suma los valores de un rango, solo en las filas donde otra columna cumple un criterio.", "label": "SUMAR.SI", "clases": ["10"], "icon": ""}], "divergente": false}, {"term": "Tabla anidada", "variants": [{"def": "Tabla insertada dentro de una celda de otra tabla. Casi siempre hay una alternativa más simple.", "label": "Tabla anidada", "clases": ["04"], "icon": ""}], "divergente": false}, {"term": "Tablero", "variants": [{"def": "Hoja de consulta que reúne tabla, gráfico y números clave, pensada para que alguien la lea de un vistazo sin editar el archivo.", "label": "Tablero", "clases": ["15"], "icon": ""}], "divergente": false}, {"term": "Tipo de dato", "variants": [{"def": "La clase de valor que un campo puede contener (texto, numérico, fecha, lógico o categórico).", "label": "Tipo de <script>
(function(){
  var D=JSON.parse(document.getElementById('data').textContent.replace(/\/\*\/?DATA\*\//g,''));
  var revisar=/[?&]revisar=1/.test(location.search);
  var C={}; D.clases.forEach(function(c){ C[c.num]=c; });
  var sel={}, qEl=document.getElementById('q');
  function norm(s){ return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
  function esc(s){ return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function plain(h){ var d=document.createElement('div'); d.innerHTML=h; return d.textContent; }
  D.terms.forEach(function(t){ t.hay=norm(t.term+' '+t.variants.map(function(v){return plain(v.def);}).join(' ')); t.nm=norm(t.term); t.cls=[]; t.variants.forEach(function(v){ v.clases.forEach(function(c){ if(t.cls.indexOf(c)<0) t.cls.push(c); }); }); });

  var chips=document.getElementById('chips');
  D.clases.forEach(function(c){
    var b=document.createElement('button'); b.type='button'; b.className='chip'; b.setAttribute('aria-pressed','false'); b.textContent='Clase '+c.num;
    b.title=c.titulo; b.style.setProperty('--c-acc',c.acento); b.style.setProperty('--c-deep',c.deep); b.style.setProperty('--c-tint',c.tint);
    b.addEventListener('click',function(){ sel[c.num]=!sel[c.num]; b.setAttribute('aria-pressed',sel[c.num]?'true':'false'); render(); });
    chips.appendChild(b);
  });
  function hi(html,toks){
    if(!toks.length) return html;
    var d=document.createElement('div'); d.innerHTML=html;
    (function walk(n){ [].slice.call(n.childNodes).forEach(function(k){
      if(k.nodeType===3){ var s=k.nodeValue, ns=norm(s), ranges=[];
        toks.forEach(function(t){ var i=ns.indexOf(t); while(i>-1){ ranges.push([i,i+t.length]); i=ns.indexOf(t,i+t.length); } });
        if(!ranges.length) return; ranges.sort(function(a,b){return a[0]-b[0];});
        var out='',pos=0; ranges.forEach(function(r){ if(r[0]<pos) return; out+=esc(s.slice(pos,r[0]))+'<mark>'+esc(s.slice(r[0],r[1]))+'</mark>'; pos=r[1]; });
        out+=esc(s.slice(pos)); var sp=document.createElement('span'); sp.innerHTML=out; k.replaceWith.apply(k,[].slice.call(sp.childNodes));
      } else walk(k); }); })(d);
    return d.innerHTML;
  }
  function render(){
    var q=norm(qEl.value.trim()), toks=q.split(/\s+/).filter(Boolean), on=Object.keys(sel).filter(function(k){return sel[k];});
    var res=D.terms.filter(function(t){
      if(on.length&&!t.cls.some(function(c){return on.indexOf(c)>-1;})) return false;
      return toks.every(function(x){return t.hay.indexOf(x)>-1;});
    });
    var list=document.getElementById('list'), letters={}, h='', cur='';
    res.forEach(function(t){
      var L=norm(t.term.charAt(0)).toUpperCase(); if(!/[A-Z]/.test(L)) L='#';
      if(L!==cur){ cur=L; letters[L]=1; h+='<h2 class="l" id="l-'+(L==='#'?'num':L)+'">'+L+'</h2>'; }
      var ic=(t.variants.filter(function(v){return v.icon;})[0]||{}).icon; h+='<article class="t"><h3>'+(ic?'<img class="ic" alt="" src="'+encodeURI('img/apps/'+ic)+'">':'')+hi(esc(t.term),toks)+(revisar&&t.divergente?'<span class="rev">Definiciones distintas</span>':'')+'</h3>';
      t.variants.forEach(function(v){
        h+='<div class="v"><p>'+hi(v.def,toks)+'</p><div class="cls">'+v.clases.filter(function(c){return !on.length||on.indexOf(c)>-1;}).map(function(c){ var k=C[c];
          return '<a class="cl" style="--c-tint:'+k.tint+';--c-deep:'+k.deep+'" href="'+encodeURI('clases/'+k.archivo)+'#glosario" title="'+esc(k.titulo)+'">Clase '+c+' · '+esc(k.titulo.split(':')[0])+'</a>'; }).join('')+'</div></div>';
      });
      h+='</article>';
    });
    list.innerHTML=h||'<p class="empty">No hay términos que coincidan con la búsqueda.</p>';
    document.getElementById('meta').textContent=res.length+' de '+D.terms.length+' términos'+(on.length?' · '+on.length+' clase'+(on.length>1?'s':'')+' seleccionada'+(on.length>1?'s':''):'');
    var az=document.getElementById('az'); az.innerHTML='';
    'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('').forEach(function(L){ if(!letters[L]) return;
      var a=document.createElement('a'); a.href='#l-'+(L==='#'?'num':L); a.textContent=L; az.appendChild(a); });
  }
  qEl.addEventListener('input',render); render();
  if(revisar){ var n=D.terms.filter(function(t){return t.divergente;}).length; document.getElementById('meta').insertAdjacentHTML('afterend','<p class="meta"><b>Modo revisión:</b> '+n+' términos con definiciones distintas entre clases.</p>'); }
})();
</script>
